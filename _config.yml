title: "Apollo Theme"
description: "Jekyll template defaults for subtree vendoring"

# No site identity here; sites supply _config.yml
url: ""        # left empty on purpose
baseurl: ""    # left empty on purpose

# Content
collections_dir: content
collections:
  essays:
    output: true
    permalink: /essays/:slug/
content:
  loader_enabled: false  # sites can set true in their _config.yml to auto-load pages from content/

defaults:
  - scope: { path: "", type: "essays" }
    values:
      layout: "essay"
      excerpt_separator: "<!--more-->"
  - scope: { path: "" }
    values:
      layout: "default"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO & assets (placeholders only)
logo: "/assets/images/icon.svg"

# Exclude dev and site-local files if present in downstream repos
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE
  - tailwind.config.js
  - package.json
  - package-lock.json
  - user-config.yml
  - build.sh
  - setup.sh
  - sync-content.sh
  - _site-config.yml
  - FEATURES.md
  - app.yaml
  - .gcloudignore
  - DEPLOYMENT.md
  - scripts/
  - main.py
  - requirements.txt
  - examples/
  - templates/
