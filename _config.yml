title: "Apollo"
description: "Jekyll template defaults for subtree vendoring"

# No site identity here; sites supply _config.yml
url: ""        # left empty on purpose
baseurl: ""    # left empty on purpose

# Content
collections_dir: content
collections:
  essays:
    output: true
    permalink: /essays/:slug/
content:
  loader_enabled: false  # sites can set true in their _config.yml to auto-load pages from content/

defaults:
  - scope: { path: "", type: "essays" }
    values:
      layout: "essay"
      excerpt_separator: "<!--more-->"
  - scope: { path: "" }
    values:
      layout: "default"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-og-image

# SEO & Social
# These settings are used by jekyll-seo-tag
logo: "/assets/images/default-og.png"  # Default social share image
twitter:
  username: "apollo_theme"        # Twitter handle without @
  card: summary_large_image      # Card type
social:
  name: "Apollo"           # Your name / Brand name
  links:                         # Social links (for JSON-LD)
    - https://twitter.com/apollo_theme
    - https://github.com/apollo_theme
author:
  name: "Apollo"
  twitter: "apollo_theme"

# OpenGraph Image Generation
og_image:
  collections: ["essays"]
  output_dir: "assets/images/og"
  verbose: true
  canvas:
    width: 1200
    height: 630
    background_color: "#f0eee6"  # Paper ivory
  header:
    font_family: "Newsreader"
    color: "#1f1e1d"  # Paper slate
  content:
    font_family: "Newsreader"
    color: "#1f1e1d"


# Exclude dev and site-local files if present in downstream repos
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE
  - tailwind.config.js
  - package.json
  - package-lock.json
  - user-config.yml
  - build.sh
  - setup.sh
  - sync-content.sh
  - _site-config.yml
  - FEATURES.md
  - app.yaml
  - .gcloudignore
  - DEPLOYMENT.md
  - scripts/
  - main.py
  - requirements.txt
  - examples/
  - templates/
