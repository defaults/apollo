<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | normalize_whitespace | truncate: 160 | default: site.description }}">
  <meta name="author" content="{{ site.user.name | default: site.author.name | default: site.title }}">
  <meta name="twitter:card" content="summary_large_image">
  {% if site.twitter.username %}
  <meta name="twitter:site" content="@{{ site.twitter.username }}">
  {% endif %}

  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

  <!-- Favicon & App Icons -->
  <link rel="icon" href="{{ '/assets/images/icon.svg' | relative_url }}" type="image/svg+xml" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ site.favicon_ico | default: '/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.apple_touch_icon | default: '/apple-touch-icon.png' | relative_url }}">

  {% feed_meta %}
  {% seo %}

  {% unless page.image %}
  <meta property="og:image" content="{{ site.logo | absolute_url }}">
  <meta name="twitter:image" content="{{ site.logo | absolute_url }}">
  {% endunless %}
  {% if site.author.twitter %}
  <meta name="twitter:creator" content="@{{ site.author.twitter }}">
  {% endif %}

  {% if page.layout == 'essay' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ page.title | escape }}",
    "description": "{{ page.description | default: page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}",
    "image": ["{{ (page.image | default: site.logo) | absolute_url }}"],
    "url": "{{ page.url | absolute_url }}",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "author": {
      "@type": "Person",
      "name": "{{ site.user.name | default: site.author.name | default: site.title | escape }}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ site.title | escape }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.logo | absolute_url }}"
      }
    }
  }
  </script>
  {% endif %}

  {% if site.google_analytics %}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
