---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  
  {% include post-metadata.html %}
  
  {% if page.description %}
  <p class="muted">{{ page.description }}</p>
  {% endif %}

  {% if page.image %}
  <figure class="post-hero">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}">
  </figure>
  {% endif %}

  {{ content }}
</article>
