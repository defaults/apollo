---
layout: default
---

<article class="essay">
  <header class="essay-header">
    <h1>{{ page.title }}</h1>

    {% if page.date %}
    <p class="date">{{ page.date | date: "%B %Y" }}</p>
    {% endif %}

    {% if page.description %}
    <p class="description muted">{{ page.description }}</p>
    {% endif %}
  </header>

  {% if page.image %}
  <figure class="post-hero">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}">
  </figure>
  {% endif %}

  <div class="essay-body">
    {{ content }}
  </div>
</article>
